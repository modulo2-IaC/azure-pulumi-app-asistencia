#cloud-config
package_update: true
packages:
  - git
  - curl

write_files:
  - path: /etc/asistencia-backend.env
    permissions: "0600"
    content: |
      PORT=${app_port}
      NODE_ENV=production
      DATABASE_URL=${database_url}
      JWT_SECRET=${jwt_secret}
      CORS_ORIGIN=${cors_origin}
      APP_TIMEZONE=${app_timezone}
      RUN_MIGRATIONS=${run_migrations}
      ADMIN_REGISTRATION_NO=${admin_registration_no}
      ADMIN_PASSWORD=${admin_password}

  - path: /etc/systemd/system/asistencia-backend.service
    content: |
      [Unit]
      Description=Asistencia Backend NestJS
      After=network.target

      [Service]
      WorkingDirectory=/opt/app
      EnvironmentFile=/etc/asistencia-backend.env
      ExecStart=/usr/bin/node dist/main.js
      Restart=always
      RestartSec=5
      User=asistenciaapp

      [Install]
      WantedBy=multi-user.target

runcmd:
  - fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - apt-get purge -y nodejs npm 2>/dev/null || true
  - curl -fsSL https://deb.nodesource.com/setup_${node_version}.x | bash - && apt-get install -y -o Dpkg::Options::="--force-overwrite" nodejs
  - rm -rf /opt/app && git clone -b "${git_branch}" "${repo_url}" /opt/app
  - cp /etc/asistencia-backend.env /opt/app/.env
  - cd /opt/app && npm install && npm run build
  - cd /opt/app && set -a && . /etc/asistencia-backend.env && set +a && (npm run migration:run || (sleep 3 && npm run migration:run)) && npm run seed:admin && npm run seed:student
  - useradd --system --no-create-home asistenciaapp || true
  - chown -R asistenciaapp:asistenciaapp /opt/app
  - systemctl daemon-reload && systemctl enable --now asistencia-backend
  - (cd /opt/app && set -a && . /etc/asistencia-backend.env && set +a && npm run seed:demo > /dev/null 2>&1 &)
  - 'echo "Setup Backend completado exitosamente: $(date)" >> /var/log/asistencia-setup.log'

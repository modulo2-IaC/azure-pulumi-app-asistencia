#cloud-config
package_update: true
packages:
  - nginx
  - git
  - curl

write_files:
  - path: /etc/asistencia-frontend.env
    permissions: "0600"
    content: |
      VITE_API_URL=${vite_api_url}

  - path: /etc/nginx/sites-available/asistencia-frontend
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;
          root /var/www/app/dist;
          index index.html;

          location /api {
              proxy_pass http://${backend_host}:${backend_port};
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection 'upgrade';
              proxy_connect_timeout 60s;
              proxy_read_timeout 120s;
          }

          location / {
              try_files $uri $uri/ /index.html;
          }
      }

runcmd:
  - fallocate -l 1G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile && echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - apt-get purge -y nodejs npm 2>/dev/null || true
  - curl -fsSL https://deb.nodesource.com/setup_${node_version}.x | bash - && apt-get install -y -o Dpkg::Options::="--force-overwrite" nodejs
  - rm -rf /var/www/app && git clone -b "${git_branch}" "${repo_url}" /var/www/app
  - cp /etc/asistencia-frontend.env /var/www/app/.env
  - cd /var/www/app && npm install && npm run build
  - chown -R www-data:www-data /var/www/app && chmod -R 755 /var/www/app/dist
  - rm -f /etc/nginx/sites-enabled/default && ln -sf /etc/nginx/sites-available/asistencia-frontend /etc/nginx/sites-enabled/asistencia-frontend
  - nginx -t && systemctl restart nginx && systemctl enable nginx
  - 'echo "Setup Frontend completado exitosamente: $(date)" >> /var/log/asistencia-setup.log'
